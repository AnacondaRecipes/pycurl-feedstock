{% set name = "pycurl" %}
{% set version = "7.47.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 5e3cf357939da8d4ceefe3c7f305afcf9b47cba66cfd95e7768ca43b38445e14

build:
  # trigger 1
  number: 0
  skip: true  # [py<310]

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - openssl  # [win]
  host:
    - pip
    - python
    - setuptools >=77
    - wheel
    - libcurl {{ libcurl }}
    - openssl {{ openssl }} # [not win] using schannel on windows
  run:
    - python
    - libcurl
    - openssl # [not win] using schannel on windows

test:
  source_files:
    - tests
    - pytest.ini
    - README.rst
    - setup.py
  imports:
    - pycurl
  requires:
    - {{ stdlib('c') }}  # [not win]
    - {{ compiler('c') }}  # [not win]
    - make  # [not win]
    - pip
    - pytest >=5
    - flask
    - flaky
    - numpy
    - pyflakes
    # For tests/setup_test.py
    - setuptools
    - websockets >=12.0
  commands:
    - pip check

about:
  home: https://pycurl.github.io/
  license: LGPL-2.1-only OR MIT
  license_file:
    - COPYING-LGPL
    - COPYING-MIT
  license_family: LGPL
  summary: A Python Interface To The cURL library
  description: |
    PycURL is a Python interface to libcurl, the multiprotocol file transfer library.
    Similarly to the urllib Python module, PycURL can be used to fetch objects identified
    by a URL from a Python program.
  doc_url: https://pycurl.github.io/
  dev_url: https://github.com/pycurl/pycurl

extra:
  recipe-maintainers:
    - chrisburr
